<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Presensi Kelas - QR Code</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --gold-1: #f5d67b;
            --gold-2: #d4a24c;
            --gold-3: #b8862b;
            --emerald-1: #34d399;
            --emerald-2: #10b981;
            --emerald-3: #047857;
            --royal-1: #667eea;
            --royal-2: #764ba2;
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-border-strong: rgba(255, 255, 255, 0.16);
        }

        html, body { -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #07060f;
            background-image:
                radial-gradient(circle at 15% 10%, rgba(102, 126, 234, 0.25), transparent 45%),
                radial-gradient(circle at 85% 90%, rgba(212, 162, 76, 0.18), transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(52, 211, 153, 0.10), transparent 60%),
                linear-gradient(160deg, #0b0a1a 0%, #141029 40%, #0a0818 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 24px 16px;
            position: relative;
            overflow-x: hidden;
        }

        /* Efek bintang berkilau di background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.6), transparent),
                radial-gradient(1px 1px at 60% 70%, rgba(255,255,255,0.4), transparent),
                radial-gradient(1.5px 1.5px at 80% 20%, rgba(245,214,123,0.7), transparent),
                radial-gradient(1px 1px at 40% 85%, rgba(255,255,255,0.5), transparent),
                radial-gradient(1px 1px at 90% 60%, rgba(255,255,255,0.3), transparent);
            pointer-events: none;
            animation: twinkle 6s ease-in-out infinite alternate;
            z-index: 0;
        }
        @keyframes twinkle {
            0% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: linear-gradient(160deg, rgba(255,255,255,0.07) 0%, rgba(255,255,255,0.02) 100%);
            backdrop-filter: blur(28px) saturate(140%);
            -webkit-backdrop-filter: blur(28px) saturate(140%);
            border-radius: 32px;
            padding: 32px 24px 24px;
            border: 1px solid var(--glass-border-strong);
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.7),
                0 0 0 1px rgba(255, 255, 255, 0.03) inset,
                0 1px 0 rgba(255, 255, 255, 0.15) inset,
                0 0 120px rgba(212, 162, 76, 0.06);
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        /* Garis emas dekoratif atas */
        .container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold-1), var(--gold-2), var(--gold-1), transparent);
            opacity: 0.9;
            box-shadow: 0 0 24px rgba(245, 214, 123, 0.5);
        }

        /* Ornamen sudut */
        .container::after {
            content: '';
            position: absolute;
            top: 16px; right: 16px;
            width: 60px; height: 60px;
            border-top: 1px solid rgba(245, 214, 123, 0.25);
            border-right: 1px solid rgba(245, 214, 123, 0.25);
            border-radius: 0 20px 0 0;
            pointer-events: none;
        }

        .icon-circle {
            width: 72px; height: 72px;
            background: linear-gradient(145deg, #f5d67b 0%, #d4a24c 45%, #b8862b 100%);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 16px;
            font-size: 30px;
            color: #1a1206;
            box-shadow:
                0 10px 40px rgba(212, 162, 76, 0.45),
                0 0 0 6px rgba(245, 214, 123, 0.08),
                0 0 0 12px rgba(245, 214, 123, 0.04),
                inset 0 -3px 8px rgba(0,0,0,0.2),
                inset 0 3px 8px rgba(255,255,255,0.5);
            position: relative;
            animation: glowPulse 3s ease-in-out infinite;
        }
        @keyframes glowPulse {
            0%, 100% { box-shadow: 0 10px 40px rgba(212, 162, 76, 0.45), 0 0 0 6px rgba(245, 214, 123, 0.08), 0 0 0 12px rgba(245, 214, 123, 0.04), inset 0 -3px 8px rgba(0,0,0,0.2), inset 0 3px 8px rgba(255,255,255,0.5); }
            50% { box-shadow: 0 10px 55px rgba(212, 162, 76, 0.65), 0 0 0 8px rgba(245, 214, 123, 0.12), 0 0 0 16px rgba(245, 214, 123, 0.06), inset 0 -3px 8px rgba(0,0,0,0.2), inset 0 3px 8px rgba(255,255,255,0.5); }
        }

        h1 {
            font-family: 'Playfair Display', serif;
            color: #fff;
            font-size: 26px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #ffffff 0%, #f5d67b 60%, #d4a24c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 20px rgba(245, 214, 123, 0.2);
        }
        .subtitle {
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
            text-align: center;
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 500;
        }

        /* Pembatas emas kecil di bawah subtitle */
        .subtitle::after {
            content: '';
            display: block;
            width: 40px; height: 2px;
            margin: 12px auto 0;
            background: linear-gradient(90deg, transparent, var(--gold-1), transparent);
            border-radius: 2px;
        }

        .qr-wrapper {
            background: linear-gradient(145deg, #ffffff 0%, #f5f5f7 100%);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 18px;
            display: inline-block;
            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.45),
                0 0 0 1px rgba(245, 214, 123, 0.3),
                0 0 60px rgba(212, 162, 76, 0.15);
            width: 100%;
            text-align: center;
            position: relative;
        }
        .qr-wrapper::before {
            content: '';
            position: absolute;
            inset: 6px;
            border: 1px solid rgba(212, 162, 76, 0.25);
            border-radius: 14px;
            pointer-events: none;
        }
        #qrImage {
            width: 200px; height: 200px;
            display: block;
            border-radius: 10px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }
        .qr-wrapper .qr-label {
            color: #1a2a3a;
            font-size: 12px;
            font-weight: 700;
            margin-top: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
            position: relative;
            z-index: 1;
        }

        .btn-group { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; justify-content: center; }

        .btn {
            padding: 12px 18px;
            border: none;
            border-radius: 14px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex; align-items: center;
            gap: 8px; text-decoration: none;
            flex: 1; justify-content: center;
            letter-spacing: 0.3px;
            position: relative;
            overflow: hidden;
        }
        .btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
            transition: left 0.6s;
        }
        .btn:hover::before { left: 100%; }

        .btn-primary {
            background: linear-gradient(135deg, #34d399 0%, #10b981 50%, #047857 100%);
            color: white;
            box-shadow: 0 8px 24px rgba(16, 185, 129, 0.35), inset 0 1px 0 rgba(255,255,255,0.25);
        }
        .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 14px 36px rgba(16, 185, 129, 0.5), inset 0 1px 0 rgba(255,255,255,0.25); }

        .btn-secondary {
            background: linear-gradient(135deg, #7c8cf8 0%, #667eea 50%, #764ba2 100%);
            color: white;
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.35), inset 0 1px 0 rgba(255,255,255,0.25);
        }
        .btn-secondary:hover { transform: translateY(-3px); box-shadow: 0 14px 36px rgba(102, 126, 234, 0.5), inset 0 1px 0 rgba(255,255,255,0.25); }

        .btn-outline {
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255,255,255,0.9);
            border: 1px solid rgba(245, 214, 123, 0.3);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
        }
        .btn-outline:hover {
            background: rgba(245, 214, 123, 0.12);
            border-color: rgba(245, 214, 123, 0.6);
            transform: translateY(-3px);
            box-shadow: 0 10px 28px rgba(212, 162, 76, 0.25), inset 0 1px 0 rgba(255,255,255,0.1);
        }

        .btn-success {
            background: linear-gradient(135deg, #f5d67b 0%, #d4a24c 50%, #b8862b 100%);
            color: #1a1206;
            box-shadow: 0 8px 24px rgba(212, 162, 76, 0.4), inset 0 1px 0 rgba(255,255,255,0.4);
            font-weight: 800;
        }
        .btn-success:hover { transform: translateY(-3px); box-shadow: 0 14px 36px rgba(212, 162, 76, 0.55), inset 0 1px 0 rgba(255,255,255,0.4); }

        .divider {
            display: flex; align-items: center;
            margin: 22px 0 14px; gap: 14px;
            color: rgba(245, 214, 123, 0.5);
            font-size: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 600;
        }
        .divider::before, .divider::after {
            content: ''; flex: 1; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(245, 214, 123, 0.3), transparent);
        }

        .scanner-area {
            position: relative;
            background: #060510;
            border-radius: 20px;
            margin-top: 14px;
            min-height: 300px;
            width: 100%;
            overflow: hidden;
            border: 1px solid rgba(245, 214, 123, 0.2);
            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.6),
                inset 0 0 60px rgba(102, 126, 234, 0.08),
                0 0 0 1px rgba(255,255,255,0.03) inset;
        }
        #qr-reader { width: 100% !important; min-height: 300px; background: #04030c; position: relative; }
        #qr-reader video { width: 100% !important; height: auto !important; border-radius: 0 !important; display: block !important; }
        #qr-reader > div:not(:first-child) { display: none !important; }
        #qr-reader > div:first-child { width: 100% !important; height: auto !important; }
        #qr-reader > div:first-child > div:first-child { width: 100% !important; height: auto !important; }

        .scanner-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10;
        }
        .scanner-overlay .scan-frame {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 62%; height: 42%;
            border: 2px solid rgba(245, 214, 123, 0.5);
            border-radius: 16px;
            box-shadow:
                0 0 0 4000px rgba(0, 0, 0, 0.6),
                0 0 30px rgba(245, 214, 123, 0.3),
                inset 0 0 30px rgba(245, 214, 123, 0.08);
        }
        .scanner-overlay .scan-frame .corner {
            position: absolute; width: 22px; height: 22px;
            border-color: var(--gold-1); border-style: solid; border-width: 0;
            filter: drop-shadow(0 0 6px rgba(245, 214, 123, 0.8));
        }
        .corner-tl { top: -2px; left: -2px; border-top-width: 4px; border-left-width: 4px; border-radius: 6px 0 0 0; }
        .corner-tr { top: -2px; right: -2px; border-top-width: 4px; border-right-width: 4px; border-radius: 0 6px 0 0; }
        .corner-bl { bottom: -2px; left: -2px; border-bottom-width: 4px; border-left-width: 4px; border-radius: 0 0 0 6px; }
        .corner-br { bottom: -2px; right: -2px; border-bottom-width: 4px; border-right-width: 4px; border-radius: 0 0 6px 0; }

        .scanner-overlay .scan-line {
            position: absolute; top: 30%; left: 20%; right: 20%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold-1), #fff, var(--gold-1), transparent);
            animation: scanMove 2.5s ease-in-out infinite;
            border-radius: 2px;
            box-shadow: 0 0 24px rgba(245, 214, 123, 0.7), 0 0 8px rgba(245, 214, 123, 0.9);
        }
        @keyframes scanMove {
            0% { top: 30%; opacity: 0.5; }
            50% { top: 70%; opacity: 1; }
            100% { top: 30%; opacity: 0.5; }
        }

        .scanner-overlay .scan-text {
            position: absolute; bottom: 16px; left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.95);
            font-size: 11px; font-weight: 600;
            background: rgba(10, 8, 24, 0.85);
            backdrop-filter: blur(12px);
            padding: 8px 18px; border-radius: 20px;
            display: flex; align-items: center; gap: 8px;
            border: 1px solid rgba(245, 214, 123, 0.3);
            box-shadow: 0 8px 24px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
            z-index: 15; white-space: nowrap;
            letter-spacing: 0.5px;
        }
        .scanner-overlay .scan-text i {
            color: var(--gold-1);
            font-size: 12px;
            animation: pulse-icon 1.5s ease-in-out infinite;
            filter: drop-shadow(0 0 4px rgba(245, 214, 123, 0.8));
        }
        @keyframes pulse-icon { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .scanner-controls { display: flex; gap: 10px; padding: 14px 0; }
        .scanner-controls button {
            flex: 1; padding: 12px; border: none; border-radius: 14px;
            font-weight: 700; font-size: 13px; cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; align-items: center; justify-content: center; gap: 8px;
            letter-spacing: 0.3px;
        }
        .btn-scan {
            background: linear-gradient(135deg, #34d399 0%, #10b981 50%, #047857 100%);
            color: white;
            box-shadow: 0 8px 24px rgba(16, 185, 129, 0.4), inset 0 1px 0 rgba(255,255,255,0.25);
        }
        .btn-scan:hover { transform: translateY(-3px); box-shadow: 0 14px 36px rgba(16, 185, 129, 0.55), inset 0 1px 0 rgba(255,255,255,0.25); }
        .btn-scan.stop {
            background: linear-gradient(135deg, #f87171 0%, #e74c3c 50%, #c0392b 100%);
            box-shadow: 0 8px 24px rgba(231, 76, 60, 0.4), inset 0 1px 0 rgba(255,255,255,0.2);
        }
        .btn-flash {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border: 1px solid rgba(245, 214, 123, 0.3);
            flex: 0.4;
        }
        .btn-flash:hover { background: rgba(245, 214, 123, 0.12); border-color: rgba(245, 214, 123, 0.6); }
        .btn-flash.active {
            background: linear-gradient(135deg, #f5d67b, #d4a24c);
            color: #1a1206;
            border-color: var(--gold-1);
            box-shadow: 0 0 24px rgba(245, 214, 123, 0.6);
        }

        #status {
            padding: 14px 18px; border-radius: 14px;
            font-weight: 600; font-size: 13px;
            display: none; animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            align-items: center; gap: 10px; margin-top: 14px;
            backdrop-filter: blur(10px);
            border: 1px solid transparent;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        #status i { font-size: 16px; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        #status.success { display: flex; background: rgba(16, 185, 129, 0.15); color: #6ee7b7; border-color: rgba(16, 185, 129, 0.4); }
        #status.error { display: flex; background: rgba(239, 68, 68, 0.15); color: #fca5a5; border-color: rgba(239, 68, 68, 0.4); }
        #status.info { display: flex; background: rgba(102, 126, 234, 0.15); color: #a5b4fc; border-color: rgba(102, 126, 234, 0.4); }
        #status.warning { display: flex; background: rgba(245, 214, 123, 0.15); color: #f5d67b; border-color: rgba(245, 214, 123, 0.4); }

        .data-section {
            margin-top: 18px;
            background: rgba(255, 255, 255, 0.025);
            border-radius: 18px;
            border: 1px solid rgba(245, 214, 123, 0.15);
            overflow: hidden;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 8px 24px rgba(0,0,0,0.3);
        }
        .data-section .data-header {
            padding: 14px 18px;
            background: linear-gradient(135deg, rgba(245, 214, 123, 0.12), rgba(212, 162, 76, 0.04));
            border-bottom: 1px solid rgba(245, 214, 123, 0.2);
            display: flex; justify-content: space-between; align-items: center;
        }
        .data-section .data-header .title {
            color: #fff; font-size: 13px; font-weight: 700;
            display: flex; align-items: center; gap: 8px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .data-section .data-header .title i { color: var(--gold-1); filter: drop-shadow(0 0 4px rgba(245, 214, 123, 0.6)); }
        .data-section .data-header .count {
            color: var(--gold-1); font-size: 11px;
            background: rgba(245, 214, 123, 0.1);
            padding: 4px 14px; border-radius: 20px;
            border: 1px solid rgba(245, 214, 123, 0.25);
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .data-section .table-wrapper { max-height: 220px; overflow-y: auto; }
        .data-section .table-wrapper::-webkit-scrollbar { width: 5px; }
        .data-section .table-wrapper::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.02); }
        .data-section .table-wrapper::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--gold-1), var(--gold-3));
            border-radius: 4px;
        }
        .data-section table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .data-section table th {
            padding: 10px 12px; text-align: left;
            color: rgba(245, 214, 123, 0.7);
            font-weight: 700; font-size: 10px;
            text-transform: uppercase; letter-spacing: 1px;
            border-bottom: 1px solid rgba(245, 214, 123, 0.15);
            position: sticky; top: 0;
            background: rgba(10, 8, 24, 0.96);
            backdrop-filter: blur(12px);
        }
        .data-section table td {
            padding: 10px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.85);
        }
        .data-section table tr { transition: background 0.25s; }
        .data-section table tr:hover td { background: rgba(245, 214, 123, 0.04); }
        .data-section table .status-hadir {
            color: #34d399; font-weight: 700;
            text-shadow: 0 0 12px rgba(52, 211, 153, 0.5);
        }
        .data-section table .status-belum { color: rgba(255, 255, 255, 0.3); }

        .footer-note {
            margin-top: 18px; font-size: 11px;
            color: rgba(255, 255, 255, 0.35); text-align: center;
            line-height: 1.7;
        }
        .footer-note i { color: var(--gold-1); }
        .footer-note a { color: var(--gold-1); text-decoration: none; font-weight: 600; transition: all 0.25s; }
        .footer-note a:hover { text-decoration: underline; text-shadow: 0 0 12px rgba(245, 214, 123, 0.6); }

        .loading-text {
            text-align: center; padding: 24px;
            color: rgba(255, 255, 255, 0.35); font-size: 13px;
        }
        .loading-text i { margin-right: 8px; color: var(--gold-1); }

        .connection-status {
            display: flex; align-items: center; gap: 8px;
            padding: 8px 14px; border-radius: 20px;
            font-size: 10px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255,255,255,0.06);
            margin-top: 12px; justify-content: center;
            letter-spacing: 0.5px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .connection-status .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
        .connection-status .dot.online {
            background: #34d399;
            box-shadow: 0 0 10px rgba(52, 211, 153, 0.8), 0 0 20px rgba(52, 211, 153, 0.4);
        }
        .connection-status .dot.offline {
            background: #f87171;
            box-shadow: 0 0 10px rgba(248, 113, 113, 0.8);
            animation: pulse-red 1s ease-in-out infinite;
        }
        .connection-status .dot.checking {
            background: #f5d67b;
            box-shadow: 0 0 10px rgba(245, 214, 123, 0.8);
            animation: pulse-yellow 0.8s ease-in-out infinite;
        }
        @keyframes pulse-red { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        @keyframes pulse-yellow { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        .qr-generate-section {
            padding: 16px 0 10px 0;
            border-top: 1px solid rgba(245, 214, 123, 0.1);
            margin-top: 8px;
        }
        .qr-generate-section .qr-label {
            font-size: 12px; font-weight: 700;
            color: rgba(255, 255, 255, 0.85);
            display: flex; align-items: center; gap: 8px;
            margin-bottom: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .qr-generate-section .qr-label i { color: var(--gold-1); filter: drop-shadow(0 0 4px rgba(245, 214, 123, 0.5)); }
        .qr-generate-section .qr-input-group { display: flex; gap: 10px; }
        .qr-generate-section .qr-input-group input {
            flex: 1; padding: 12px 16px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px; font-size: 14px;

        .qr-preview img {

        @media (max-width: 480px) {
            body { padding: 12px; }

    </style>
</head>
<body>

    <div class="container">

            <i class="fas fa-crown"></i>
        </div>

        <h1>Presensi Kelas</h1>
        <p class="subtitle">✦ Scan QR Code untuk Absensi ✦</p>

        <div class="qr-wrapper">
            <img id="qrImage" src="" alt="QR Code Presensi" />
            <div class="qr-label">

            <button class="btn btn-success" onclick="loadAllData()">

                    <thead>
                        <tr>
                            <th>NIM</th>
                            <th>Nama</th>

                <i class="fas fa-check-circle" style="color:#10b981;"></i> Status: <span id="presensiStatus">Menunggu scan</span>

<script>
/* ===================================================================
   FRONTEND — Presensi Kelas QR
   Data PERMANEN di Google Sheets (lihat file Code.gs terpisah).
   localStorage hanya sebagai CACHE offline.
   =================================================================== */

/* ---------------- KONFIGURASI ---------------- */
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbwFaiXWeQmp9D1U6YKlNM2u28Dgp8mcnYmzWxoWXH_FS3Po3oWJt1-kknsCZ_yRDranPQ/exec',
  SHEET_URL: 'https://docs.google.com/spreadsheets/d/1PXOSZAXZNg7hvX-33DglZlM3saj4yclUhiYepiFNYhI/edit?gid=0#gid=0',
  SHEET_GID_MAHASISWA: '0',
  SHEET_GID_PRESENSI: '646034675',
  CACHE_KEY_MAHASISWA: 'presensi_mahasiswa_cache_v2',
  CACHE_KEY_PRESENSI: 'presensi_hari_ini_cache_v2',
  REFRESH_INTERVAL_MS: 30000,
  RESCAN_DELAY_MS: 2500
};
/* --------------------------------------------- */

/* ---------------- STATE ---------------- */
const State = {
  scanner: null,
  scanning: false,
  flashOn: false,
  processing: false,
  mahasiswa: [],
  presensiHariIni: {},
  isOnline: false,
  tanggalHariIni: ''
};

/* ---------------- DOM ---------------- */
const $ = id => document.getElementById(id);
const DOM = {
  status: $('status'),
  scanStatus: $('scanStatusText'),
  presensiStatus: $('presensiStatus'),
  btnStartScan: $('btnStartScan'),
  btnFlash: $('btnFlash'),
  qrImage: $('qrImage'),
  tableBody: $('tableBody'),
  dataTable: $('dataTable'),
  loadingData: $('loadingData'),
  totalMahasiswa: $('totalMahasiswa'),
  statusDot: $('statusDot'),
  statusLabel: $('statusLabel'),
  qrNimInput: $('qrNimInput'),
  qrResultImage: $('qrResultImage'),
  qrInfo: $('qrInfo'),
  qrPreview: $('qrPreview')
};

/* ================== UTIL ================== */
function todayStr() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${dd}`;
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}

function setConnectionStatus(status, message) {
  if (!DOM.statusDot || !DOM.statusLabel) return;
  DOM.statusDot.className = 'dot ' + status;
  DOM.statusLabel.textContent = message;
  State.isOnline = (status === 'online');
}

let statusTimer;
function showStatus(message, type = 'info', duration = 4000) {
  if (!DOM.status) return;
  const iconMap = {
    success: 'fa-check-circle',
    error: 'fa-exclamation-circle',
    warning: 'fa-triangle-exclamation',
    info: 'fa-info-circle'
  };
  DOM.status.innerHTML = `<i class="fas ${iconMap[type] || iconMap.info}"></i> ${message}`;
  DOM.status.className = type;
  DOM.status.style.display = 'flex';
  clearTimeout(statusTimer);
  if (duration > 0) {
    statusTimer = setTimeout(() => { DOM.status.style.display = 'none'; }, duration);
  }
}

/* ================== API HELPER ================== */
async function apiGet(action, params = {}) {
  const qs = new URLSearchParams({ action, t: Date.now(), ...params });
  const res = await fetch(CONFIG.API_URL + '?' + qs.toString(), {
    method: 'GET',
    redirect: 'follow'
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

async function apiPost(action, payload = {}) {
  const res = await fetch(CONFIG.API_URL, {
    method: 'POST',
    redirect: 'follow',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, ...payload })
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

/* ================== CACHE ================== */
function loadCacheMahasiswa() {
  try {
    const raw = localStorage.getItem(CONFIG.CACHE_KEY_MAHASISWA);
    return raw ? JSON.parse(raw) : [];
  } catch { return []; }
}

function saveCacheMahasiswa(data) {
  try { localStorage.setItem(CONFIG.CACHE_KEY_MAHASISWA, JSON.stringify(data)); } catch {}
}

function loadCachePresensi() {
  try {
    const raw = localStorage.getItem(CONFIG.CACHE_KEY_PRESENSI);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (parsed.tanggal !== todayStr()) return null;
    return parsed.map || {};
  } catch { return null; }
}

function saveCachePresensi(map) {
  try {
    localStorage.setItem(CONFIG.CACHE_KEY_PRESENSI, JSON.stringify({
      tanggal: todayStr(),
      map
    }));
  } catch {}
}

/* ================== LOAD DATA ================== */
async function checkConnection() {
  setConnectionStatus('checking', 'Mengecek koneksi...');
  try {
    const json = await apiGet('ping');
    if (json.success) {
      setConnectionStatus('online', '✅ Terhubung ke server');
      return true;
    }
    throw new Error(json.error || 'Ping gagal');
  } catch (err) {
    setConnectionStatus('offline', '📴 Offline');
    return false;
  }
}

async function loadAllData() {
  State.tanggalHariIni = todayStr();

  const cachedMhs = loadCacheMahasiswa();
  if (cachedMhs.length) {
    State.mahasiswa = cachedMhs;
    State.presensiHariIni = loadCachePresensi() || {};
    renderDataTable();
  } else {
    if (DOM.loadingData) DOM.loadingData.style.display = 'block';
    if (DOM.dataTable) DOM.dataTable.style.display = 'none';
  }

  const online = await checkConnection();
  if (!online) {
    if (!cachedMhs.length) {
      showEmptyState('offline');
    } else {
      showStatus('📂 Mode offline — data dari cache', 'warning', 3000);
    }
    return;
  }

  try {
    const mhsRes = await apiGet('get_all');
    if (mhsRes.success && Array.isArray(mhsRes.data)) {
      State.mahasiswa = mhsRes.data;
      saveCacheMahasiswa(mhsRes.data);
    } else {
      showStatus('⚠️ ' + (mhsRes.error || 'Gagal memuat mahasiswa'), 'warning', 3500);
    }

    const presRes = await apiGet('get_presensi', { tanggal: todayStr() });
    if (presRes.success && Array.isArray(presRes.data)) {
      const map = {};
      presRes.data.forEach(p => { if (p.nim) map[String(p.nim).trim()] = p; });
      State.presensiHariIni = map;
      saveCachePresensi(map);
    }

    renderDataTable();
    showStatus(`✅ ${State.mahasiswa.length} mahasiswa · ${Object.keys(State.presensiHariIni).length} hadir hari ini`, 'success', 2500);
  } catch (err) {
    console.error(err);
    if (State.mahasiswa.length) {
      showStatus('⚠️ Gagal sinkron server — pakai cache', 'warning', 3500);
      renderDataTable();
    } else {
      showEmptyState('error', err.message);
    }
  }
}

/* ================== RENDER ================== */
function renderDataTable() {
  if (!DOM.tableBody || !DOM.dataTable || !DOM.loadingData) return;
  DOM.tableBody.innerHTML = '';

  if (!State.mahasiswa.length) {
    showEmptyState('empty');
    return;
  }

  State.mahasiswa.forEach(mhs => {
    const nim = String(mhs.nim || '').trim();
    const hadir = !!State.presensiHariIni[nim];
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><strong>${escapeHtml(nim || '-')}</strong></td>
      <td>${escapeHtml(mhs.nama || '-')}</td>
      <td>${escapeHtml(mhs.kelas || '-')}</td>
      <td>${escapeHtml(mhs.jurusan || '-')}</td>
      <td>
        <span class="${hadir ? 'status-hadir' : 'status-belum'}">
          <i class="fas ${hadir ? 'fa-check-circle' : 'fa-circle'}"></i>
          ${hadir ? 'Hadir' : 'Belum'}
        </span>
      </td>`;
    DOM.tableBody.appendChild(tr);
  });

  DOM.loadingData.style.display = 'none';
  DOM.dataTable.style.display = 'table';
  const totalHadir = Object.keys(State.presensiHariIni).length;
  DOM.totalMahasiswa.textContent = `${totalHadir} / ${State.mahasiswa.length} mahasiswa`;
}

function showEmptyState(kind, detail = '') {
  if (!DOM.loadingData) return;
  DOM.dataTable.style.display = 'none';
  DOM.loadingData.style.display = 'block';
  DOM.totalMahasiswa.textContent = '0 mahasiswa';

  if (kind === 'offline') {
    DOM.loadingData.innerHTML = `
      <i class="fas fa-wifi" style="color:#f87171;font-size:24px;display:block;margin-bottom:12px;"></i>
      <strong style="color:#f87171;">Tidak Ada Koneksi</strong><br><br>
      <span style="color:rgba(255,255,255,0.5);font-size:12px;">Tidak ada internet & tidak ada cache.</span><br><br>
      <button onclick="loadAllData()" style="padding:8px 20px;background:linear-gradient(135deg,#f5d67b,#d4a24c);color:#1a1206;border:none;border-radius:10px;cursor:pointer;font-weight:700;">
        <i class="fas fa-sync-alt"></i> Coba Lagi
      </button>`;
  } else if (kind === 'empty') {
    DOM.loadingData.innerHTML = `
      <i class="fas fa-info-circle" style="color:#f5d67b;font-size:20px;display:block;margin-bottom:12px;"></i>
      <strong style="color:#f5d67b;">Belum ada data mahasiswa</strong><br><br>
      <span style="color:rgba(255,255,255,0.5);font-size:12px;">Tambahkan data di sheet "Mahasiswa".</span><br><br>
      <a href="${CONFIG.SHEET_URL}" target="_blank" style="padding:8px 20px;background:linear-gradient(135deg,#f5d67b,#d4a24c);color:#1a1206;border:none;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-block;font-weight:700;">
        <i class="fas fa-external-link-alt"></i> Buka Google Sheets
      </a>`;
  } else {
    DOM.loadingData.innerHTML = `
      <i class="fas fa-exclamation-circle" style="color:#ef4444;font-size:24px;display:block;margin-bottom:12px;"></i>
      <strong style="color:#ef4444;">Gagal Memuat Data</strong><br><br>
      <span style="color:rgba(255,255,255,0.5);font-size:12px;">${escapeHtml(detail)}</span><br><br>
      <button onclick="loadAllData()" style="padding:8px 20px;background:linear-gradient(135deg,#f5d67b,#d4a24c);color:#1a1206;border:none;border-radius:10px;cursor:pointer;font-weight:700;">
        <i class="fas fa-sync-alt"></i> Coba Lagi
      </button>`;
  }
}

/* ================== QR UMUM ================== */
function generateQR() {
  if (!DOM.qrImage) return;
  const qrData = {
    nim: 'ABSENSI-KELAS',
    nama: 'Presensi Kelas',
    kelas: 'Semua',
    jurusan: 'Semua',
    link_sheet: CONFIG.SHEET_URL,
    timestamp: new Date().toISOString()
  };
  DOM.qrImage.src = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(JSON.stringify(qrData))}`;
}

function downloadQR() {
  if (!DOM.qrImage.src) { alert('QR Code belum siap.'); return; }
  const a = document.createElement('a');
  a.download = 'qr-presensi-kelas.png';
  a.href = DOM.qrImage.src;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

/* ================== QR PER MAHASISWA ================== */
function generateQRCode() {
  const nim = DOM.qrNimInput.value.trim();
  if (!nim) { showStatus('❌ Masukkan NIM terlebih dahulu', 'error'); DOM.qrNimInput.focus(); return; }
  if (nim.length < 3) { showStatus('❌ NIM minimal 3 karakter', 'error'); return; }

  const mhs = State.mahasiswa.find(m => String(m.nim).trim() === nim);
  if (!mhs) { showStatus(`❌ NIM ${escapeHtml(nim)} tidak terdaftar!`, 'error'); return; }

  const qrData = {
    nim: mhs.nim,
    nama: mhs.nama,
    kelas: mhs.kelas,
    jurusan: mhs.jurusan,
    link_sheet: CONFIG.SHEET_URL,
    timestamp: new Date().toISOString()
  };
  DOM.qrResultImage.src = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(JSON.stringify(qrData))}`;
  DOM.qrInfo.innerHTML = `
    <strong>NIM:</strong> ${escapeHtml(mhs.nim)} &bull;
    <strong>Nama:</strong> ${escapeHtml(mhs.nama)} &bull;
    <strong>Kelas:</strong> ${escapeHtml(mhs.kelas)} &bull;
    <strong>Jurusan:</strong> ${escapeHtml(mhs.jurusan)}
    <div style="margin-top:8px;font-size:12px;color:#34d399;">
      <i class="fas fa-check-circle"></i> Scan QR untuk presensi
    </div>`;
  DOM.qrPreview.classList.add('show');
  showStatus(`✅ QR Code dibuat untuk ${escapeHtml(mhs.nama)} (${escapeHtml(nim)})`, 'success');
}

function downloadQRCode() {
  if (!DOM.qrResultImage.src) { showStatus('❌ Tidak ada QR Code', 'error'); return; }
  const a = document.createElement('a');
  const nim = DOM.qrNimInput.value.trim() || 'mahasiswa';
  a.download = `qr-code-${nim}.png`;
  a.href = DOM.qrResultImage.src;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  showStatus('✅ QR Code berhasil didownload!', 'success');
}

function closeQRPreview() {
  DOM.qrPreview.classList.remove('show');
  DOM.qrNimInput.value = '';
}

/* ================== SCANNER ================== */
function toggleScanner() {
  if (State.scanning) stopScanner();
  else startScanner();
}

function startScanner() {
  if (State.scanning) return;

  if (State.scanner) {
    try { State.scanner.clear(); } catch {}
    State.scanner = null;
  }

  const readerEl = $('qr-reader');
  if (readerEl) readerEl.innerHTML = '';

  if (DOM.btnStartScan) {
    DOM.btnStartScan.classList.add('stop');
    DOM.btnStartScan.innerHTML = '<i class="fas fa-stop"></i> Stop Scan';
  }

  try {
    State.scanner = new Html5Qrcode("qr-reader", {
      verbose: false,
      formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE]
    });

    const config = { fps: 10, qrbox: { width: 250, height: 250 }, aspectRatio: 1.0 };
    const onSuccess = (text) => onScanSuccess(text);
    const onError = () => {};

    State.scanner.start({ facingMode: "environment" }, config, onSuccess, onError)
      .then(() => onScannerStarted('📷 Kamera belakang aktif'))
      .catch(() => {
        State.scanner.start({ facingMode: "user" }, config, onSuccess, onError)
          .then(() => onScannerStarted('📷 Kamera depan aktif'))
          .catch(err2 => {
            showStatus('❌ Gagal akses kamera: ' + err2.message, 'error', 0);
            resetScannerButton();
          });
      });
  } catch (err) {
    showStatus('❌ Gagal inisialisasi scanner', 'error', 0);
    resetScannerButton();
  }
}

function onScannerStarted(msg) {
  State.scanning = true;
  if (DOM.scanStatus) DOM.scanStatus.textContent = '🔍 Mendeteksi QR Code...';
  if (DOM.presensiStatus) DOM.presensiStatus.textContent = 'Mendeteksi...';
  showStatus(msg, 'info', 3000);
}

function stopScanner() {
  if (State.scanner && State.scanning) {
    State.scanner.stop()
      .then(() => {
        try { State.scanner.clear(); } catch {}
        State.scanner = null;
        State.scanning = false;
        resetScannerButton();
        if (DOM.scanStatus) DOM.scanStatus.textContent = '⏸ Scanner berhenti';
      })
      .catch(() => {});
  } else {
    State.scanning = false;
    resetScannerButton();
  }
}

function resetScannerButton() {
  if (!DOM.btnStartScan) return;
  DOM.btnStartScan.classList.remove('stop');
  DOM.btnStartScan.innerHTML = '<i class="fas fa-play"></i> <span id="btnScanLabel">Mulai Scan</span>';
}

/* ================== SCAN SUCCESS ================== */
function onScanSuccess(decodedText) {
  if (State.processing) return;
  State.processing = true;

  if (State.scanner && State.scanning) {
    State.scanner.stop()
      .then(() => { try { State.scanner.clear(); } catch {} State.scanner = null; State.scanning = false; resetScannerButton(); })
      .catch(() => {});
  }

  processPresensi(decodedText);
}

/* ================== PROSES PRESENSI (INTI) ================== */
async function processPresensi(qrData) {
  const tanggal = todayStr();
  try {
    showStatus('⏳ Memproses presensi...', 'info', 0);

    let nim = '';
    try {
      const parsed = JSON.parse(qrData);
      nim = String(parsed.nim || '').trim();
    } catch {
      nim = String(qrData || '').trim();
    }

    if (!nim || nim.length < 3) {
      showStatus('❌ NIM tidak valid (minimal 3 karakter)', 'error');
      return;
    }

    const mhs = State.mahasiswa.find(m => String(m.nim).trim() === nim);
    if (!mhs) {
      showStatus(`❌ NIM ${escapeHtml(nim)} tidak terdaftar!`, 'error');
      return;
    }

    if (State.presensiHariIni[nim]) {
      showStatus(`⚠️ ${escapeHtml(mhs.nama)} sudah presensi hari ini!`, 'warning');
      if (DOM.scanStatus) DOM.scanStatus.textContent = '⚠️ Sudah presensi';
      if (DOM.presensiStatus) DOM.presensiStatus.textContent = '⚠️ Sudah hadir';
      return;
    }

    const payload = {
      nim,
      nama: mhs.nama || '',
      kelas: mhs.kelas || '',
      jurusan: mhs.jurusan || '',
      mataKuliah: 'Presensi Kelas',
      status: 'Hadir'
    };

    let result;
    try {
      result = await apiPost('presensi', payload);
    } catch (netErr) {
      State.presensiHariIni[nim] = { nim, tanggal, offline: true, waktu: new Date().toLocaleString('id-ID') };
      saveCachePresensi(State.presensiHariIni);
      renderDataTable();
      showStatus(`📴 Offline — ${escapeHtml(mhs.nama)} dicatat lokal. Sinkronkan saat online.`, 'warning', 5000);
      if (DOM.scanStatus) DOM.scanStatus.textContent = '📴 Tersimpan lokal';
      return;
    }

    if (result.success) {
      State.presensiHariIni[nim] = { nim, tanggal, waktu: result.waktu || '', nama: mhs.nama };
      saveCachePresensi(State.presensiHariIni);
      renderDataTable();
      showStatus(`✅ ${escapeHtml(mhs.nama)} HADIR — tersimpan di Google Sheets`, 'success', 3500);
      if (DOM.scanStatus) DOM.scanStatus.textContent = '✅ Hadir!';
      if (DOM.presensiStatus) DOM.presensiStatus.textContent = '✅ Hadir';
    } else if (result.already) {
      State.presensiHariIni[nim] = { nim, tanggal, waktu: result.data?.waktu || '' };
      saveCachePresensi(State.presensiHariIni);
      renderDataTable();
      showStatus(`⚠️ ${escapeHtml(mhs.nama)} sudah presensi hari ini (server)`, 'warning', 3500);
      if (DOM.scanStatus) DOM.scanStatus.textContent = '⚠️ Sudah presensi';
    } else {
      showStatus('❌ ' + (result.error || 'Gagal menyimpan presensi'), 'error', 4000);
    }
  } catch (err) {
    console.error(err);
    showStatus('❌ Error: ' + err.message, 'error', 4000);
  } finally {
    setTimeout(() => {
      State.processing = false;
      if (DOM.scanStatus) DOM.scanStatus.textContent = 'Arahkan ke QR Code';
      if (!State.scanning) startScanner();
    }, CONFIG.RESCAN_DELAY_MS);
  }
}

/* ================== FLASH ================== */
async function toggleFlash() {
  State.flashOn = !State.flashOn;
  if (!DOM.btnFlash) return;

  if (State.flashOn) {
    DOM.btnFlash.classList.add('active');
    DOM.btnFlash.innerHTML = '<i class="fas fa-bolt" style="color:#1a1206;"></i>';
  } else {
    DOM.btnFlash.classList.remove('active');
    DOM.btnFlash.innerHTML = '<i class="fas fa-bolt"></i>';
  }

  try {
    const video = document.querySelector('#qr-reader video');
    if (!video || !video.srcObject) return;
    const track = video.srcObject.getVideoTracks()[0];
    if (!track) return;
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    if (caps.torch) {
      await track.applyConstraints({ advanced: [{ torch: State.flashOn }] });
    }
  } catch (e) { /* torch tidak didukung */ }
}

/* ================== IZIN KAMERA ================== */
async function checkCameraPermission() {
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showStatus('❌ Browser tidak mendukung kamera', 'error', 0);
      return false;
    }
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    stream.getTracks().forEach(t => t.stop());
    return true;
  } catch {
    showStatus('❌ Izin kamera diperlukan untuk scan QR Code', 'error', 0);
    return false;
  }
}

/* ================== INIT ================== */
async function init() {
  State.tanggalHariIni = todayStr();

  const sheetLinkMhs = CONFIG.SHEET_URL + '#gid=' + CONFIG.SHEET_GID_MAHASISWA;
  const sheetLinkPres = CONFIG.SHEET_URL + '#gid=' + CONFIG.SHEET_GID_PRESENSI;
  if ($('sheetLink')) $('sheetLink').href = sheetLinkPres;
  if ($('footerSheetLink')) $('footerSheetLink').href = sheetLinkPres;

  generateQR();
  if (DOM.presensiStatus) DOM.presensiStatus.textContent = 'Menunggu scan...';

  await loadAllData();

  setInterval(() => { loadAllData(); }, CONFIG.REFRESH_INTERVAL_MS);

  const cameraReady = await checkCameraPermission();
  if (cameraReady) {
    setTimeout(startScanner, 800);
  }
}

document.addEventListener('DOMContentLoaded', init);

window.addEventListener('beforeunload', function () {
  if (State.scanner && State.scanning) {
    State.scanner.stop().then(() => { try { State.scanner.clear(); } catch {} }).catch(() => {});
  }
});
</script>
